name: MaltaShop order and messaging CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile and syntax check
        run: python -m compileall -q common order broker notification tests
      - name: Unit and component tests (gate)
        run: python -m pytest tests -v
      - name: Cross-service local event flow (gate)
        run: python scripts/verify_local_end_to_end.py
      - name: Validate Compose configuration (gate)
        run: docker compose config --quiet
      - name: Build three immutable container images (gate)
        run: docker compose build
      - name: Integrated smoke test (gate)
        run: |
          docker compose up -d --wait
          python scripts/smoke.py http://localhost:8000
      - name: Verify asynchronously consumed event (gate)
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T notification python -c "import sqlite3; db=sqlite3.connect('/data/notification.db'); assert db.execute('SELECT COUNT(*) FROM inbox').fetchone()[0] >= 1" \
              && docker compose exec -T broker python -c "import sqlite3; db=sqlite3.connect('/data/broker.db'); assert db.execute('SELECT COUNT(*) FROM messages WHERE state=?', ('acked',)).fetchone()[0] >= 1"; then
              echo 'EVENT DELIVERY PASS: Notification inbox and broker acknowledgement confirmed' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 1
          done
          echo 'Notification did not consume the order event'
          exit 1
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Tear down test stack
        if: always()
        run: docker compose down --volumes || true
# Production promotion is a separate, environment-protected workflow.
# GitHub screenshots must be taken after this has actually run on the hosted repository.
